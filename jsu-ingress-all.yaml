apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jsu-ingress
  namespace: jenkins-ns
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: www.jsu.com
    http:
      paths:
      - path: /jenkins
        pathType: Prefix
        backend:
          service:
            name: jenkins-service
            port:
              number: 8080
      - path: /clinic
        pathType: Prefix
        backend:
          service:
            name: clinic-service
            namespace: clinic-ns
            port:
              number: 80
