apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-petclinic
  namespace: clinic-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-petclinic
  template:
    metadata:
      labels:
        app: spring-petclinic
    spec:
      containers:
      - name: spring-petclinic
        image: springio/spring-petclinic:3.0.2
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: clinic-service
  namespace: clinic-ns
spec:
  selector:
    app: spring-petclinic
  ports:
  - port: 80
    targetPort: 8080
